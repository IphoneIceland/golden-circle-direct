.leaflet-tile,
.leaflet-marker-icon,

.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}

/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */

	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,

	max-height: none !important;
	width: auto;
	padding: 0;
	}

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}

	touch-action: none;

}

	-ms-touch-action: none;
	touch-action: none;

	width: 40px;
	height: 20px;
	position: absolute;
	left: 50%;
	margin-top: -1px;
	margin-left: -20px;
	overflow: hidden;
	pointer-events: none;

.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,

.leaflet-tooltip {

.leaflet-tooltip-bottom:before,

<style>
  @font-face{font-family:'Norse';src:url('fonts/Norse.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Norse';src:url('fonts/NorseBold.woff2') format('woff2');font-weight:700;font-display:swap}
  /* iGuide Iceland tokens, lifted from the site's style.css */
  :root{--bg:#0d0d0f;--panel:#14141a;--panel2:#1a1a20;--line:rgba(244,240,230,.14);
        --ink:#f4f0e6;--mute:#cbc4b0;--dim:#837e6f;--accent:#d4a94a;--accent-2:#b48a2f;
        --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
        --sans:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --fs:16px;--lh:1.8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior-x:none;font-family:var(--sans);background:var(--bg);color:var(--ink)}
  #wrap{display:flex;flex-direction:column;height:100%;height:100dvh;overflow:hidden}

  /* the whole journey, one row. six legs, your position on it */
  #track{flex:0 0 auto;display:flex;gap:3px;padding:10px 10px 8px;background:var(--panel2)}
  .leg{flex:1;min-width:0;background:#243039;border-radius:5px;padding:6px 4px 5px;text-align:center;
       cursor:pointer;border-top:3px solid transparent;transition:background .15s}
  .leg .ic{font-size:12px;line-height:1}
  .leg .nm{display:block;font:600 8.5px/1.2 -apple-system,sans-serif;color:#7d8fa0;margin-top:3px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .leg.done{background:#1e1a12}
  .leg.now{background:#2a2418;border-top-color:var(--accent)}
  .leg.now .nm{color:#dff1fb}
  .leg.now.stop{background:#2a2418;border-top-color:var(--accent)}

  /* the parts of the leg you are in */
  #steps{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 10px 10px;background:var(--panel2);
         border-bottom:1px solid var(--line)}
  #steps .nav{flex:none;width:40px;height:34px;font-size:19px;line-height:1;padding:0;border-radius:8px;
              background:var(--panel);border:1px solid var(--line);color:var(--ink)}
  #steps .nav:disabled{opacity:.25}
  #dots{flex:1;min-width:0;display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none}
  #dots::-webkit-scrollbar{display:none}
  .dot2{flex:none;height:6px;min-width:14px;flex:1 1 auto;background:#2f3d4a;border-radius:3px;cursor:pointer}
  .dot2.done{background:var(--accent-2)}
  .dot2.now{background:var(--accent);height:8px}
  #days{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
        padding:16px 16px 34px;font-size:var(--fs);line-height:var(--lh);border-top:1px solid var(--line)}
  .blkbody{max-width:66ch}
  .day{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel2);overflow:hidden}
  .dayhead{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;user-select:none}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .dayhead .t{font-size:1.02em;font-weight:600;flex:1;line-height:1.45}
  .day.shown{border-color:#5ec8f2}
  .dayhead .m{font-size:.82em;color:var(--mute);white-space:nowrap;text-align:right;line-height:1.5}
  .body{display:none;padding:2px 13px 13px}
  .day.open .body{display:block}
  .stop{display:block;padding:2px 0 0;border-top:none}
  .look{font-size:.97em;line-height:1.5;color:var(--accent);margin-top:9px}
  .stop[data-key]{cursor:pointer;border-radius:6px;margin:0 -6px;padding-left:6px;padding-right:6px;transition:background .12s}
  .stop[data-key]:hover{background:#232c35}
  .stop[data-key]:hover .sn{color:var(--accent)}
  .stop[data-key]:active{background:#2a343f}
  .num{flex:none;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:flex;align-items:center;justify-content:center;font:700 .78em/1 ui-monospace,Menlo,monospace;color:#0e1114}
  .num.noview{background:transparent;border:1.5px dashed #93a1b0;color:#93a1b0}
  .sc{flex:1;min-width:0}
  .sn{font-family:"Norse",var(--serif);font-weight:700;font-size:1.5em;line-height:1.2;letter-spacing:.01em;color:var(--ink)}
  .sub{font-family:var(--serif);font-size:1.12em;line-height:1.4;color:var(--accent);margin-top:5px}
  .thr{font-size:.82em;font-weight:600;color:#7d8fa0;margin-top:7px;line-height:1.5}
  .storylab{font-size:.78em;font-weight:700;color:var(--dim);margin-top:18px;margin-bottom:2px;letter-spacing:.11em;text-transform:uppercase}
  .sd{font-size:11.5px;color:var(--mute);line-height:1.5;margin-top:1px}
  .tstrip{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-top:10px}
  .tstrip .lb{font-size:.76em;font-weight:700;color:#8fa3b4;margin-right:3px}
  .tstrip .v{font-size:.98em;font-weight:700;color:#e8edf2;line-height:1.5}
  .tstrip .v.dep{color:#9fe0ff}
  .tstrip .dr{font-size:.88em;font-weight:600;color:#8fb6cc;white-space:nowrap;line-height:1.5}
  .tstrip .sep{color:#39434e}
  .blkbody{display:none;padding:2px 0 6px}
  .stop.open + .blkbody{display:block}
  .hook{margin-top:15px;padding:14px 16px;border-radius:10px;background:#17150f;border:1px solid rgba(212,169,74,.35);color:var(--ink);font-family:var(--serif);font-size:1.22em;line-height:1.55}
  .blkbody ul{margin:8px 0 0;padding-left:20px}
  .blkbody li{font-size:1em;line-height:var(--lh);color:var(--mute);margin-bottom:14px;padding-left:2px}
  .pt{margin-top:14px;padding:12px 15px;background:transparent;border:none;border-left:3px solid var(--accent);color:var(--mute);font-size:1em;line-height:var(--lh)}
  .mc{margin-top:12px;padding:13px 15px;border-radius:10px;background:#1f1a10;border:1px solid rgba(212,169,74,.28);color:var(--accent);font-family:var(--serif);font-size:1.18em;line-height:1.5}
  .wx{margin-top:12px;padding:12px 14px;border-radius:9px;background:#1a2027;border:1px solid #2b3641;color:#adc0ce;font-size:.95em;line-height:var(--lh)}
  .flag{margin-top:12px;padding:13px 14px;border-radius:9px;background:#33191a;border:1px solid #6b2b2b;color:#ffc4c4;font-size:1em;line-height:var(--lh)}
  .pre{margin-top:9px;padding:9px 10px;border-radius:7px;background:#11161b;border:1px solid #232c35;color:#9fb3c2;font:10.5px/1.55 ui-monospace,Menlo,monospace;overflow-x:auto;white-space:pre}
  .sublab{font-size:.85em;font-weight:700;color:#8fa3b4;margin-top:14px}
  .say{margin-top:10px;border-top:1px solid #262e37;padding-top:8px}
  .say>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;user-select:none;padding:2px 0}
  .say>summary::-webkit-details-marker{display:none}
  .say>summary .sublab{margin-top:0}
  .say>summary .chev{color:#8fa3b4;font-size:.72em;line-height:1;transition:transform .15s ease;display:inline-block}
  .say[open]>summary .chev{transform:rotate(90deg)}
  .say>summary .cnt{font-size:.8em;font-weight:700;color:#8fa3b4}
  .say>summary:hover .sublab,.say>summary:hover .cnt,.say>summary:hover .chev{color:var(--accent)}
  .say>div:first-of-type{margin-top:7px}
  .say div{font-size:.95em;line-height:1.85;color:#b6c3ce;margin-bottom:7px}
  .say b{color:#e8edf2;font-weight:600}
  .blkbody li b,.hook b,.pt b,.flag b,.mc b{font-weight:700;color:var(--ink)}
  .say .gloss{color:#7f8f9d}
  .say i{color:#f4d5a0;font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:.9em}
  .legln{font-size:.9em;color:#8496a5;margin-top:5px;line-height:1.55}
  .tags{font-size:10px;color:#5b6b7a;margin-top:8px}
  #map{flex:0 0 34%;box-shadow:0 -14px 18px -6px rgba(14,17,20,.95);z-index:2;min-height:150px;position:relative;border-top:1px solid var(--line)}
  #langs{display:flex;align-items:center;gap:10px;padding:2px 0 16px}
  #langs label{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);flex:none}
  #lang{flex:1;min-width:0;appearance:none;-webkit-appearance:none;
        background:var(--panel2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23d4a94a' stroke-width='2' fill='none'/></svg>") no-repeat right 14px center;
        border:1px solid var(--line);border-radius:10px;color:var(--ink);
        font:600 15px/1 var(--sans);padding:12px 38px 12px 14px;cursor:pointer}
  #lang:focus{outline:none;border-color:var(--accent)}
  #lang option:disabled{color:var(--dim)}
  #pick .step{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:26px 0 4px}
  #pick h1{margin:0 0 12px}
  #pick .lead{color:var(--mute);font-size:15px;line-height:1.6;margin:0 0 12px}
  #whichtour{margin-top:30px}
  #brief{position:fixed;inset:0;z-index:880;background:var(--bg);overflow-y:auto;
         padding:24px 18px calc(96px + env(safe-area-inset-bottom))}
  #brief h1{margin:2px 0 4px;font-family:"Norse",var(--serif);font-weight:700;font-size:28px;letter-spacing:.02em}
  #brief .step{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:20px}
  .bitem{display:flex;gap:13px;padding:14px 0;border-top:1px solid var(--line)}
  .bitem .bi{font-size:20px;line-height:1.2;flex:none;width:26px;text-align:center}
  .bitem h2{margin:0 0 5px;font-size:15px;font-weight:700;color:var(--ink)}
  .bitem p{margin:0 0 5px;font-size:14.5px;line-height:1.65;color:var(--mute)}
  .bitem p b{color:var(--ink)}
  .bitem p i{color:var(--accent);font-style:normal}
  #go{position:fixed;left:14px;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:890;
      padding:15px;border-radius:12px;background:var(--accent);color:#17150f;border:none;
      font:700 16px/1 var(--sans);cursor:pointer}
  #logo{display:block;width:min(190px,52vw);margin:6px auto 22px}
  #pick{position:fixed;inset:0;z-index:900;background:var(--bg);padding:26px 18px;overflow-y:auto}
  #pick h1{margin:4px 0 18px;font-family:"Norse",var(--serif);font-weight:700;font-size:28px;letter-spacing:.02em}
  #picklist{display:flex;flex-direction:column;gap:10px}
  .tcard{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
         padding:15px 16px;cursor:pointer;font-family:inherit;color:var(--ink);width:100%}
  .tcard:hover{border-color:var(--accent)}
  .tcard b{display:block;font-family:"Norse",var(--serif);font-weight:700;font-size:21px;margin-bottom:5px;letter-spacing:.01em}
  .tcard span{font-size:12.5px;color:var(--mute);line-height:1.5}
  /* A house, with the words next to it. No arrow — an arrow has a direction to
     misread, and half the point of a house is that it doesn't. direction:ltr is
     deliberate: home stays top-left in all 21 languages, RTL included, because
     top-left IS the home corner and a house doesn't mirror. */
  #topbar{flex:0 0 auto;direction:ltr;display:flex;align-items:center;gap:10px;
          padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  #home{flex:none;display:inline-flex;align-items:center;justify-content:center;
        width:44px;height:44px;padding:0;border-radius:11px;cursor:pointer;
        background:var(--accent);border:1px solid var(--accent);color:#0d0d0f}
  #home:hover,#home:active{background:var(--accent-2);border-color:var(--accent-2)}
  #home svg{width:23px;height:23px;display:block;flex:none}
  #tourname{flex:1 1 auto;min-width:0;text-align:right;font-size:12px;color:var(--mute);
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #zhint{position:absolute;z-index:500;bottom:14px;left:14px;background:rgba(22,27,33,.92);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--mute)}
  #foot{padding:11px 20px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mute);line-height:1.6}
  #foot a{color:var(--accent)}
</style>
</head>
<body>
<div id="pick">
  <div id="langs"></div>
  <img id="logo" src="images/iguide-logo-stacked.svg" alt="iGuide Iceland">
  <div id="welcome"></div>
  <div id="safety"></div>
  <h1 id="whichtour">Which tour?</h1>
  <div id="picklist"></div>
</div>
<div id="brief" hidden></div>
<div id="wrap" hidden>
  <div id="topbar">
    <button id="home"></button>
    <span id="tourname"></span>
  </div>
  <div id="track"></div>
  <div id="steps"></div>
  <div id="days"></div>
  <div id="map"><div id="zhint">Zoom in further to show place names</div></div>
</div>
</div>

<script>
// ---- tour picker -------------------------------------------------------
const TOURS = window.__TOURS__;
const PICK  = document.getElementById("pick");
const WRAP  = document.getElementById("wrap");
const KEYT  = "gcd-tour";

// Leaving a tour reloads rather than unpicking boot() by hand: one code path,
// no half-torn-down map, and the shell comes straight out of the service worker.
function leaveTour(){
  try{ localStorage.removeItem(KEYT); }catch(e){}
  location.replace(location.pathname);
}
// A guest's instinct is the phone's own back gesture, not a button we drew.
// Opening a tour pushes a history entry so back lands on the picker instead of
// leaving the site entirely.
window.addEventListener("popstate",()=>{ if(!WRAP.hidden) leaveTour(); });

function loadScript(src){
  return new Promise((ok,bad)=>{
    const el=document.createElement("script");
    el.src=src; el.onload=ok; el.onerror=()=>bad(new Error("could not load "+src));
    document.head.appendChild(el);
  });
}
async function openTour(t){
  PICK.innerHTML='<h1>Loading '+t.name+'…</h1>';
  try{
    await loadScript("route-"+t.id+".js");
    await loadScript("script-"+t.id+".js");
    await loadScript("cues-"+t.id+".js");
  }catch(err){
    PICK.innerHTML='<h1>'+t.name+' would not load</h1><p style="color:#ffb3b3">'+err.message+'</p>';
    return;
  }
  try{ localStorage.setItem(KEYT,t.id); }catch(e){}
  try{ history.pushState({tour:t.id},"","#"+t.id); }catch(e){}
  PICK.remove();
  WRAP.hidden=false;
  boot(t);
}
function showLangs(){
  const box=document.getElementById("langs");
  const L=window.__LANGS__;
  box.innerHTML=
    '<label for="lang">Language</label>'+
    '<select id="lang">'+
      L.map(l=>'<option value="'+l.code+'"'+(l.live?"":" disabled")+(l.code==="en"?" selected":"")+'>'+
               l.flag+"  "+l.name+(l.live?"":" — not yet")+'</option>').join("")+
    '</select>';
  const sel=document.getElementById("lang");
  sel.value=LANG;
  sel.onchange=e=>{
    const l=L.find(x=>x.code===e.target.value);
    if(!l||!l.live){ e.target.value=LANG; return; }
    LANG=l.code;
    try{ localStorage.setItem("gcd-lang",LANG); }catch(err){}
    applyDir(); showWelcome(); showSafety(); showPicker();
    const t=T();
    document.getElementById("langs").querySelector("label").textContent=(t&&t.ui.language)||"Language";
    document.getElementById("whichtour").textContent=(t&&t.ui.whichTour)||"Which tour?";
    document.getElementById("pick").scrollTop=0;
  };
}

// Step 1, then step 2, then the tour.
const MD = t => t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>");
const block = i => '<div class="bitem"><div class="bi">'+i.icon+'</div><div><h2>'+i.head+'</h2>'+
                   i.body.map(x=>"<p>"+MD(x)+"</p>").join("")+'</div></div>';

// English lives in briefing.js; every other language overrides it from i18n/.
let LANG="en";
const T = () => (LANG==="en" ? null : (window.__I18N__||{})[LANG]);
// Arabic and Hebrew read right to left. The flag says so; the <html> element has to hear it.
function applyDir(){
  const t=T();
  document.documentElement.dir = (t && t.rtl) ? "rtl" : "ltr";
}
function showWelcome(){
  const t=T();
  const W=(t&&t.welcome)||window.__WELCOME__;
  document.getElementById("welcome").innerHTML=
    '<div class="step">'+W.step+'</div><h1>'+W.title+'</h1>'+
    '<p class="lead">'+W.lead+'</p>'+ W.items.map(block).join("");
}
function showSafety(){
  const t=T();
  const B=(t&&t.briefing)||window.__BRIEFING__;
  document.getElementById("safety").innerHTML=
    '<div class="step">'+B.step+'</div><h1>'+B.title+'</h1>'+ B.items.map(block).join("");
}

function showBriefingUnused(done){

// ---- the app -----------------------------------------------------------
function boot(TOUR){
const R = window.__ROUTE__, S = window.__SCRIPT__, CUES = window.__CUES__;
const CUE = {}; CUES.forEach(c => CUE[c.id] = c);
const COL = {drive:"#5ec8f2", stop:"#c8a2f2"};

// fadeAnimation:false is not cosmetic. With a service worker in front of the tile requests,
// Leaflet's fade never flips tiles from opacity 0 to 1 — every tile downloads correctly
// (naturalWidth 256) and then paints invisibly, so you get a blank map and no error anywhere.
// Turning the fade off makes tiles opaque the moment they arrive.
const map = L.map("map",{fadeAnimation:false}).setView([64.15,-20.9],8);

// Esri has real imagery to z18 over the whole route. z19 is only Reykjavik —
// everywhere else it serves a flat grey "no data" tile, so 18 is the honest cap.
// detectRetina asks for one zoom deeper on 2x/3x screens and draws it at half
// size: genuinely twice the pixels on a phone, and Leaflet clamps at maxNativeZoom
// so it never reaches for the grey.
const SAT = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:19, maxNativeZoom:18, detectRetina:true, attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'});
const TERRAIN = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {maxZoom:19, maxNativeZoom:15, attribution:'&copy; OpenTopoMap, &copy; OpenStreetMap contributors'});
const DARK = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'});
// Road casings and place names printed over the imagery — satellite alone is pretty and useless.
const SATLBL = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:19, maxNativeZoom:16, detectRetina:true, attribution:''});

// Sentinel-2 cloudless (EOX, CC-BY) as a second imagery source. Esri is better where it
// has coverage, but if anything blocks it — a preview pane, an ad blocker, a corporate
// network — a grey rectangle is useless on a coach. Fall through instead of failing.
const SAT2 = L.tileLayer("https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg",
  {maxZoom:19, maxNativeZoom:14, attribution:'Sentinel-2 cloudless &copy; EOX IT Services (CC BY-NC-SA 4.0)'});

SAT.addTo(map); SATLBL.addTo(map);
const layerCtl = L.control.layers({"Satellite (Esri)":SAT,"Satellite (Sentinel-2)":SAT2,"Terrain":TERRAIN,"Dark map":DARK},
                 {"Names on satellite":SATLBL},{position:"topright"}).addTo(map);

// ---- imagery watchdog -------------------------------------------------------
// Leaflet fires tileerror per failed tile. A handful is normal at the edges of coverage;
// a wall of them means the source is blocked. Switch once, say so, and move on.
let satErr = 0, satOK = 0, switched = false;
SAT.on("tileload", ()=>{ satOK++; });
SAT.on("tileerror", ()=>{
  satErr++;
  if(switched || satOK > 0 || satErr < 6) return;
  switched = true;
  map.removeLayer(SAT); SAT2.addTo(map);
  banner("Esri imagery is blocked here — switched to Sentinel-2. Layers control, top right, to change it.");
});
SAT2.on("tileerror", ()=>{
  if(!switched) return;
  banner("Both satellite sources are blocked. You are almost certainly viewing this in a preview pane — open the file in a browser.");
});
function banner(msg){
  let el = document.getElementById("tilewarn");
  if(!el){
    el = document.createElement("div"); el.id = "tilewarn";
    el.style.cssText = "position:absolute;z-index:600;top:10px;left:10px;max-width:340px;background:#3a1a1a;"
      + "border:1px solid #6b2b2b;color:#ffb3b3;border-radius:7px;padding:8px 11px;font:11.5px/1.5 -apple-system,sans-serif";
    document.getElementById("map").appendChild(el);
  }
  el.textContent = msg;
}

// The road you have actually travelled. It grows as the tour does — nothing
// ahead of you is drawn, because you haven't been there yet.
const GEO = R.geometry;
const CUM = (()=>{
  const out=[0];
  for(let i=1;i<GEO.length;i++){
    const [a,b]=GEO[i-1], [c,d]=GEO[i];
    const dy=(c-a)*111.32, dx=(d-b)*111.32*Math.cos((a+c)/2*Math.PI/180);
    out.push(out[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  return out;
})();
const TOTAL = CUM[CUM.length-1];
function travelled(pct){
  if(pct==null) return [GEO[0]];
  const want = TOTAL*Math.max(0,Math.min(100,pct))/100;
  const out=[];
  for(let i=0;i<GEO.length;i++){
    out.push(GEO[i]);
    if(CUM[i]>=want) break;
  }
  return out.length>1?out:[GEO[0],GEO[0]];
}
const routeLine = L.polyline(travelled(0),{color:"#5ec8f2",weight:4,opacity:.9}).addTo(map);
// How far along the road each block sits.
// Blocks with a pin are anchors. Blocks without one — the story blocks you tell
// while driving — are spaced evenly between the anchors either side, so the line
// creeps forward the whole way instead of standing still and then jumping.
// Anchors are also forced to never go backwards.
const PROG = (()=>{
  const ids=[]; S.sections.forEach(sec=>sec.blocks.forEach(b=>ids.push(b.id)));
  const val=ids.map(id=>{
    const c=CUE[id];
    return (c && typeof c.progress==="number") ? c.progress : null;
  });
  // no anchor can sit behind the one before it
  let high=0;
  for(let i=0;i<val.length;i++){
    if(val[i]===null) continue;
    if(val[i]<high) val[i]=high; else high=val[i];
  }
  if(val[0]===null) val[0]=0;
  if(val[val.length-1]===null) val[val.length-1]=high;
  // fill the gaps evenly
  for(let i=0;i<val.length;i++){
    if(val[i]!==null) continue;
    let a=i-1; while(a>=0 && val[a]===null) a--;
    let b=i+1; while(b<val.length && val[b]===null) b++;
    const from=val[a], to=(b<val.length?val[b]:from);
    let gapEnd=b; let n=gapEnd-a;
    for(let k=i;k<gapEnd;k++) val[k]=from+(to-from)*((k-a)/n);
    i=gapEnd-1;
  }
  const m={}; ids.forEach((id,i)=>m[id]=val[i]);
  return m;
})();

function esc(s){ return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function md(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>"); }

// One marker: where you are now.
const HERE = L.circleMarker([0,0],{radius:8,color:"#fff",weight:3,fillColor:"#5ec8f2",fillOpacity:1,
  pane:"markerPane"});
function focusBlock(id){
  const c=CUE[id];
  if(!c||!c.pin){ return; }              // story block — leave the map where it is
  HERE.setLatLng([c.pin.lat,c.pin.lon]).addTo(map);
  map.panTo([c.pin.lat,c.pin.lon],{animate:true,duration:.4});
}

function blockRow(b, kind){
  const say=(b.say||[]).map(s=>`<div><i>[${esc(s[1])}]</i> — <b>${esc(s[0])}</b>${s[2]?` <span class="gloss">(${esc(s[2])})</span>`:""}</div>`).join("");
  const heads=(b.heads||[]).map(h=>`<div class="sublab">${esc(h[0])}</div><ul>${h[1].map(x=>`<li>${md(x)}</li>`).join("")}</ul>`).join("");
  const pre=(b.pre||[]).map(p=>`<div class="sublab">${esc(p[0])}</div><div class="pre">${esc(p[1])}</div>`).join("");
  return `<div class="stop" data-key="${b.id}">
      <div class="sc"><div class="sn">${b.emoji?b.emoji+" ":""}${esc(b.title)}</div>
      ${b.sub?`<div class="sub">${esc(b.sub)}</div>`:""}
      ${b.cue?`<div class="look">${esc(b.cue)}</div>`:""}</div></div>
    <div class="blkbody">
      ${b.hook?`<div class="hook">${md(b.hook)}</div>`:""}
      ${heads}${pre}
      ${(b.bullets&&b.bullets.length)?`<ul>${b.bullets.map(x=>`<li>${md(x)}</li>`).join("")}</ul>`:""}
      ${b.point?`<div class="pt">${md(b.point)}</div>`:""}
      ${b.mic?`<div class="mc">${md(b.mic)}</div>`:""}
      ${b.weather?`<div class="wx">${md(b.weather)}</div>`:""}
      ${say?`<details class="say"><summary><span class="chev">▶</span><span class="sublab">How to say it</span><span class="cnt">${(b.say||[]).length}</span></summary>${say}</details>`:""}
    </div>`;
}
let SI=0, BI=0;
const flat=()=>{const o=[];S.sections.forEach((sec,si)=>sec.blocks.forEach((b,bi)=>o.push({si,bi})));return o;};
const $=id=>document.getElementById(id);
const track=$("track"), steps=$("steps"), list=$("days");

// The way home, in words, at the top of the screen, before anything else.
{ const t=T(), lbl=(t&&t.ui&&t.ui.back)||"Choose another tour";
  const home=$("home");
  home.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" '+
                 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
                 '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.7V20h13V9.7"/>'+
                 '<path d="M9.7 20v-6h4.6v6"/></svg>';
  home.title=lbl;
  home.setAttribute("aria-label",lbl);
  home.onclick=leaveTour;
  $("tourname").textContent=TOUR.name; }

steps.innerHTML='<button class="nav" id="pv">‹</button><div id="dots"></div><button class="nav" id="nx">›</button>';

function paintTrack(){
  track.innerHTML="";
  S.sections.forEach((sec,i)=>{
    const el=document.createElement("div");
    el.className="leg"+(i<SI?" done":"")+(i===SI?" now":"")+(sec.kind==="stop"?" stop":"");
    el.innerHTML='<div class="ic">'+(sec.kind==="stop"?"📍":"🚌")+'</div><span class="nm">'+esc(sec.title)+'</span>';
    el.onclick=()=>{ SI=i; BI=0; render(); };
    track.appendChild(el);
  });
  const dots=$("dots"); dots.innerHTML="";
  S.sections[SI].blocks.forEach((b,i)=>{
    const d=document.createElement("div");
    d.className="dot2"+(i<BI?" done":"")+(i===BI?" now":"");
    d.title=b.title;
    d.onclick=()=>{ BI=i; render(); };
    dots.appendChild(d);
  });
  const f=flat(), pos=f.findIndex(x=>x.si===SI&&x.bi===BI);
  $("pv").disabled = pos<=0;
  $("nx").disabled = pos>=f.length-1;
}

function render(){
  const sec=S.sections[SI], b=sec.blocks[BI];
  list.innerHTML=blockRow(b,sec.kind);
  list.querySelectorAll(".stop[data-key]").forEach(r=>r.classList.add("open"));
  list.scrollTop=0;
  paintTrack();
  routeLine.setLatLngs(travelled(PROG[b.id]));
  focusBlock(b.id);
}
function step(d){
  const f=flat(), pos=f.findIndex(x=>x.si===SI&&x.bi===BI)+d;
  if(pos<0||pos>=f.length) return;
  SI=f[pos].si; BI=f[pos].bi; render();
}
// Swipe the script sideways to change block. Vertical drags are left alone so
// the pane still scrolls, and a swipe is only counted if it is clearly sideways.
(function(){
  const pane=$("days");
  let x0=0,y0=0,t0=0,tracking=false;
  pane.addEventListener("touchstart",e=>{
    if(e.touches.length!==1){tracking=false;return;}
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); tracking=true;
  },{passive:true});
  pane.addEventListener("touchmove",e=>{
    if(!tracking||e.touches.length!==1) return;
    const dx=e.touches[0].clientX-x0, dy=e.touches[0].clientY-y0;
    if(Math.abs(dy)>Math.abs(dx)) tracking=false;         // they are scrolling
    else if(Math.abs(dx)>12 && e.cancelable) e.preventDefault();
  },{passive:false});
  pane.addEventListener("touchend",e=>{
    if(!tracking) return;
    tracking=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0, ms=Date.now()-t0;
    if(Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.5 || ms>800) return;
    step(dx<0 ? 1 : -1);
    pane.animate([{opacity:.35,transform:`translateX(${dx<0?18:-18}px)`},{opacity:1,transform:"none"}],
                 {duration:180,easing:"ease-out"});
  },{passive:true});
})();

// Two-finger sideways swipe, anywhere in the app.
// Listening on window rather than the text pane: the pointer is often over the
// map or the track, and Safari hands the gesture to history if nobody claims it.
(function(){
  let acc=0, lock=false, reset=null;
  const onWheel = e=>{
    const ax=Math.abs(e.deltaX), ay=Math.abs(e.deltaY);
    if(ax<=ay){ acc=0; return; }                 // vertical — leave it to scroll
    if(e.cancelable) e.preventDefault();          // stop Safari's back/forward
    if(lock) return;
    acc += e.deltaX;
    clearTimeout(reset);
    reset = setTimeout(()=>{acc=0;}, 220);        // a gesture that stalls is dropped
    if(Math.abs(acc) > 55){
      step(acc > 0 ? 1 : -1);
      acc = 0; lock = true;
      setTimeout(()=>{ lock=false; }, 380);
    }
  };
  window.addEventListener("wheel", onWheel, {passive:false, capture:true});
})();

$("pv").onclick=()=>step(-1);
$("nx").onclick=()=>step(1);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){e.preventDefault();step(-1);}
  if(e.key==="ArrowRight"){e.preventDefault();step(1);}
});
map.on("zoomend",()=>{document.getElementById("zhint").style.display=map.getZoom()>=11?"none":"block";});


render();
{ const c=CUE[S.sections[0].blocks[0].id];
  const p=(c&&c.pin)?[c.pin.lat,c.pin.lon]:GEO[0];
  map.setView(p,13); }
}   // end boot()

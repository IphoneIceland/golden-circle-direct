 say:[["Tungufljót","TOON-gu-flyoht","Tongue-River, the quiet river we're crossing"],
      ["Faxi","FAX-i","Vatnsleysufoss, its broad 7 m curtain of a waterfall with a salmon ladder built in"],
      ["Brúárvirkjun","BROO-ar-VIRK-yun","the small hydro station its water now spins"],
      ["Hvítá","KHVEE-tau","the glacial river this one drains into"]],
 tags:["#technology"]},

{id:"1.23", emoji:"🍅", title:"Reykholt & Friðheimar — Tomatoes in the Arctic", cue:"Passing Friðheimar, Reykholt.",
 target:{lat:64.1783286, lon:-20.4476081, name:"Friðheimar"},
 hook:"We grow **tomatoes, cucumbers, peppers and strawberries** at the latitude of **Fairbanks, Alaska** — heated by hot water that **costs us almost nothing**.",
 bullets:[
  "**Reykholt** (\"smoky hill\") in **Bláskógabyggð** is the village; **Friðheimar** is its star farm — a working geothermal greenhouse complex where you can eat lunch among the vines.",
  "Inside, roughly **ten thousand tomato plants** grow under LED lights on **geothermal water** piped straight from the ground, pollinated by **imported Dutch bumblebees** — Iceland has no native pollinator strong enough for tomato flowers, so it flew in a workforce.",
  "The signature dish is **unlimited tomato soup eaten three feet from the plants that made it**. Same volcanic heat that warms Reykjavík's homes, just aimed at lunch."],
 point:"Just south of the Arctic, you shouldn't be able to grow a tomato — so Iceland grows a big share of its own tomatoes and cucumbers on volcano heat and skips the shipping.",
 mic:"At our latitude, you shouldn't be able to grow a tomato. So we built a farm on a volcano and flew in Dutch bees to run it.",
 weather:"If it's grey and gloomy out there, look for the greenhouses glowing pink through the murk — that's ten thousand tomato plants and a workforce of Dutch bumblebees ignoring the weather entirely.",
 say:[["Reykholt","RAYK-holt","smoky hill, the village we're passing"],
      ["Friðheimar","FRITH-hay-mar","its star farm, the greenhouses where you eat tomato soup among the vines"],
      ["Bláskógabyggð","BLOW-skoh-ga-byggð","the municipality Reykholt sits in"]],
 tags:["#geology","#technology"]},

{id:"1.24", emoji:"🐎", title:"Icelandic Horses — Living Viking Heritage", cue:"Look at the horses in the field.",
 target:null,
 hook:"The horse in that field is a **direct descendant of a Viking horse** — a bloodline effectively **closed for ~1,000 years**. Just don't call it a pony. That's the one hill Iceland will genuinely die on.",
 bullets:[
  "The **Icelandic horse** is small (**~132–145 cm**), shaggy, long-lived (often **30 years**), tough and frankly opinionated — and by breed convention and national insistence, **always a \"horse,\" never a pony**.",
  "No new bloodstock has arrived since roughly the year **1000**, so it's essentially a **closed, disease-naïve population** — one of the purest native breeds on Earth. Tradition says the **Alþingi** slammed the import door around **982**; the documented ban dates to **1882** — and it still stands.",
  "Most breeds have three or four gaits; the Icelandic has up to **five**, including the famous **tölt** — a four-beat running walk so smooth you could carry a full beer and not spill it. The extra gaits trace to a **single gene mutation**.",
  "Population ~**78,000** in Iceland and ~**195,000 abroad** across 30+ countries — the diaspora outnumbers the home herd two to one, and **not one of them is ever allowed back** (biosecurity enforced by MAST, the food and veterinary authority)."],
 point:"A horse breed Vikings would still recognise — kept intact for a millennium by isolation, hard winters, and a one-way export door.",
 mic:"You can take an Icelandic horse out of Iceland. You just can't bring it back. The country runs a one-way door for its own livestock.",
 weather:"If the fog's hidden the horses in the field, they don't mind — a shaggy little breed that's shrugged off a thousand Icelandic winters isn't bothered by one damp afternoon.",
 say:[["tölt","TURLT","the smooth four-beat running walk you could carry a full beer through"],
      ["Alþingi","AL-thing-i","Iceland's parliament"]],
 tags:["#law"]},

{id:"1.25", emoji:"⛪", title:"Skálholt — Bishops, Heads, and Rock Bands", cue:"At Skálholt.",
 target:{lat:64.1253127, lon:-20.524143, name:"Skálholtskirkja"},
 hook:"For **700 years**, this farm was Iceland's **capital, university and cathedral** rolled into one. Then a **1784 earthquake** ate the lot — and the country never gave it back.",
 bullets:[
  "**Skálholt** was Iceland's first **episcopal see**, founded **1056** — for 700 years the country's brain: bishops, Iceland's **first school** (Skálholtsskóli, 1056), a scriptorium and a library, all bankrolled by a guaranteed **church tithe from 1097**.",
  "It gave Iceland its **only saint** — **Þorlákur Þórhallsson**, declared holy by the Alþingi in **1198** and formally made **patron saint of Iceland by the Vatican in 1984**; his feast on 23 December still anchors the Icelandic Christmas.",
  "The **Reformation** arrived on **7 November 1550** with the beheading here of **Jón Arason** — the Catholic bishop of *Hólar*, the northern see — and two of his sons. The Lutheran takeover, sealed in blood on this lawn.",
  "A **~magnitude-7 earthquake** (South Iceland Seismic Zone) in **1784** levelled the cathedral; the Danes used it to abolish the bishopric and shift the see to a fishing village called **Reykjavík** (1796). The current church is a **1963 reconstruction** — where the blues-rock band **Kaleo** later recorded a track live, because Iceland."],
 point:"Iceland's centre of power didn't fall to an invasion. It fell to a fault line — and politics finished the job.",
 mic:"A 700-year capital, ended by a single earthquake and a Danish administrative form.",
 weather:"If the weather's swallowed the church, picture it anyway — a plain white building on a low hill that was, for seven hundred years, the entire brain of the country.",
 say:[["Skálholt","SKOWL-holt","the farm that was Iceland's capital, university and cathedral for 700 years"],
      ["Jón Arason","YOHN AR-a-son","the Catholic bishop of Hólar, beheaded here in 1550"],
      ["Þorlákur","THOR-low-kur","Iceland's only saint, whose feast on 23 December still anchors the Icelandic Christmas"]],
 tags:["#geology","#religion"]},

{id:"1.26", emoji:"🎵", title:"Grímsnes & Kerið — Red Walls, Blue Lake, Björk on a Raft", cue:"At Kerið crater.",
 target:{lat:64.0409591, lon:-20.8846110, name:"Kerið"},
 hook:"A **red volcanic crater** with a **bright blue lake** at the bottom — that **Björk once performed on**, from a **floating raft**.",
 bullets:[
  "**Kerið** is a **~6,500-year-old volcanic crater** — about **270 m long, 170 m wide and 55 m deep**: enough to swallow a **17-storey building**.",
  "The walls are **red scoria** — iron-rich basalt cinders so young the iron is **still rusting**; give it a few thousand more years and it'll blacken like its neighbours. The lake is **groundwater** (7–14 m deep) with **no inlet or outlet** — it just tracks the water table, turquoise because the water absorbs red light first against a dark floor. There's even life in it: a **2014 study found 10 kinds of zooplankton**.",
  "It sits in the **Grímsnes** volcanic field on the western rift — the northernmost of a four-crater row blown from a single eruption.",
  "The bowl's acoustics are superb, so it's hosted **concerts on a floating stage**. The famous first, in **August 1987**, drew ~**5,000 people** and was headlined by the operatic bass **Kristinn Sigmundsson**; a 21-year-old **Björk** (then in the early Sugarcubes) was on the bill too — real, but not the headliner the postcards promise."],
 point:"A crater that doubles as the world's most exclusive natural amphitheatre — built by a volcano, booked by an opera singer and a young Björk.",
 mic:"Most countries put concerts in arenas. Iceland puts them in volcanoes.",
 weather:"If the fog's filled the crater, use your imagination — bright red walls, a turquoise lake at the bottom, and once, a very young Björk singing from a raft in the middle of it.",
 say:[["Kerið","KER-ith","the red crater with the blue lake in the bottom, about 6,500 years old"],
      ["Grímsnes","GRIMS-nes","the volcanic field it sits in, on the western rift"],
      ["Björk","BYURK","on the bill here in 1987, aged 21, singing from a raft on the lake"],
      ["Kristinn Sigmundsson","KRIST-in SIG-munds-son","the operatic bass who actually headlined that 1987 concert"]],
 tags:["#geology"]},

{id:"1.27", emoji:"⚡", title:"Sog River — The River That Ran Everything", cue:"Crossing the Sog.",
 target:{lat:64.0625189, lon:-20.9914354, name:"Sog"},
 hook:"A river that's only **20 km long** — and powered **half of Iceland** for **50 years**.",
 bullets:[
  "The **Sog** flows out of **Þingvallavatn** (Iceland's biggest natural lake) and joins the Hvítá to form the Ölfusá.",
  "Short but huge in volume — **Iceland's largest clearwater (spring-fed) river**, ~**110 m³/s** of glacier-filtered, lake-clear water, perfect for hydro.",
  "Three plants — **Ljósafoss**, **Írafoss** and **Steingrímsstöð**, built **1937–1959** — a combined **~90 MW** that together ran roughly **half of Iceland's electricity** through the 1960s and 70s, until the bigger highland plants on the **Þjórsá** took over.",
  "And where did Iceland's electric age actually start? Not here — in a **carpenter's workshop in Hafnarfjörður**: on **12 December 1904**, **Jóhannes Reykdal** switched on the country's **first power station**, lighting **15 houses — the school and the Good Templars' hall among them — plus his own workshop and four street lamps**, in time for Christmas. From one carpenter's stream to all of this, in a single lifetime.",
  "Also one of Iceland's best **brown trout** rivers."],
 point:"Three small hydro plants on one short river — and they kept the country running for half a century.",
 mic:"Big rivers get the postcards. The Sog quietly ran the lights.",
 weather:"Even if the rain's hidden the Sog, remember it's only twenty kilometres long and once powered half the country — the quiet ones usually are doing the real work.",
 say:[["Sog","SOG","the 20 km river we're crossing that once powered half of Iceland"],
      ["Ljósafoss","LYOH-sa-foss","the first of its three power stations, 1937"],
      ["Írafoss","EE-ra-foss","the middle of the three power stations, 1953"],
      ["Steingrímsstöð","STAYN-grims-staeth","the last of the three, 1959"],
      ["Hvítá","KHVEE-tau","the glacial river the Sog joins"],
      ["Ölfusá","UL-vus-ow","the big drain river the two of them become"],
      ["Þjórsá","THYOR-sow","Iceland's longest river, whose bigger highland plants took over from the Sog"],
      ["Reykdal","RAYK-dal","Jóhannes Reykdal, the carpenter who switched the country on"],
      ["Hafnarfjörður","HAP-nar-fyur-thur","the town where Iceland's first power station lit up in December 1904"]],
 tags:["#geology","#law","#technology"]},

{id:"1.28", emoji:"🌊", title:"Ölfusá — The Final Drain", cue:"Look right at 1–2 o'clock — Ölfusá.",
 target:{lat:63.9359567, lon:-21.0998804, name:"Ölfusá"},
 hook:"The river ahead carries more water than any other in Iceland — and **most of it isn't even called Ölfusá**. It's **four rivers in disguise**, sharing a name only for the last 25 km.",
 bullets:[
  "The glacial **Hvítá** runs south from **Langjökull** past Gullfoss, gathering **Tungufljót** and **Brúará**.",
  "The spring-fed **Sog** drains **Þingvallavatn**. The two trunk rivers meet just above Selfoss — and from there the combined flow is the **Ölfusá**, **Iceland's biggest river by discharge** (~**423 m³/s**, draining a basin of ~**5,760 km²**).",
  "For centuries this was the ultimate obstacle: no bridge anywhere, just a ferry at **Laugardælir** paid in **cattle or cod** to reach the harbour at **Eyrarbakki**. When it flooded catastrophically in **1623**, a bishop blamed a giant river serpent — an \"ice worm.\" (It was an ice-jam flood. The serpent got the better press.)"],
 point:"Every drop of water that fell on the Golden Circle — glaciers, geysers, lakes — eventually squeezes through this one channel.",
 mic:"Four rivers. One channel. Centuries of cattle-and-cod toll. All Golden Circle water leads here.",
 weather:"If you can't see the big river off to the right, that's the Ölfusá — four rivers wearing one name, carrying more water than anything else in Iceland, somewhere out there in the grey.",
 say:[["Ölfusá","UL-vus-ow","Iceland's biggest river by discharge; four rivers under one name"],
      ["Hvítá","KHVEE-tau","the glacial half, running south from Langjökull past Gullfoss"],
      ["Sog","SOG","the spring-fed half, draining Þingvallavatn"],
      ["Laugardælir","LOY-ghar-DYE-lir","the old ferry crossing, paid in cattle or cod"],
      ["Brúará","BROO-au-rou","one of the rivers the Hvítá gathers on the way"],
      ["Langjökull","LANG-yur-kutl","the glacier the Hvítá starts from"],
      ["Tungufljót","TOON-gu-flyoht","the other river the Hvítá gathers"]],
 tags:["#geology"]},

{id:"1.29", emoji:"🏗️", title:"Selfoss — The Great Milk Collapse", cue:"Look right at 3 o'clock — Ölfusárbrú.",
 target:{lat:63.9387838, lon:-21.0047735, name:"Ölfusárbrú"},
 hook:"What's more dangerous than a world war? Apparently, **two milkmen in a very big hurry**.",
 bullets:[
  "The **1891 Ölfusárbrú** — pushed through the Alþingi by MP and banker **Tryggvi Gunnarsson** — was Iceland's **first suspension bridge**, and the town of Selfoss grew up around the crossing. No bridge, no Selfoss.",
  "In **WWII**, British troops guarded it day and night — whoever held the only crossing of Iceland's biggest river held the south.",
  "Then in **September 1944**, after 53 years, **two trucks crossed at the same time**. The eastern bearing cables couldn't take the concentrated weight, **snapped, and dropped the bridge into the river**. Both drivers survived. A replacement was built in about **five and a half months**, opening **21 December 1945** — mid-war, because the town's lifeline doesn't wait."],
 point:"The enemy that took out the Selfoss bridge wasn't an army. It was two overloaded trucks and a bridge built for lighter days.",
 mic:"The war couldn't blow this bridge up. A couple of dairy trucks did it on a Tuesday afternoon.",
 weather:"If the fog's hidden the bridge on your right, spare a thought for it — a whole world war couldn't drop it, but two overloaded milk trucks on the same afternoon absolutely did.",
 say:[["Selfoss","SEL-foss","the town that grew up around the crossing; no bridge, no Selfoss"],
      ["Ölfusárbrú","UL-vus-owr-broo","the bridge on your right, Iceland's first suspension bridge, 1891"],
      ["Tryggvi Gunnarsson","TRIG-vi GUN-nar-son","the MP and banker who pushed the bridge through the Alþingi"]],
 flag:"DATE CLASH — collapse September 1944, rebuild \"about five and a half months\", opening 21 December 1945. That is 15 months, and Dec 1945 is after VE and VJ Day, so \"mid-war\" cannot be right either. Two of those three numbers are wrong. Verify before you say it.",
 tags:["#wwii"]},

{id:"1.30", emoji:"🧭", title:"Ingólfur Arnarson — The Founder's Path", cue:"Look ahead at 12 o'clock — the Ring Road (Leið 1).",
 target:null,
 hook:"Would you move your whole family to an empty island based on **where two pieces of furniture washed up**?",
 bullets:[
  "We're on **Leið 1**, the Ring Road — only completed in **1974** for the 1,100-year settlement anniversary; before that, reaching Höfn meant hundreds of extra km on rough tracks.",
  "Per the saga, **Ingólfur Arnarson** — remembered as the **first *permanent Norse* settler** (not the first human here; Gaelic monks and a Norseman called Náttfari both beat him to it) — threw his carved **high-seat pillars** overboard and vowed to settle wherever they washed up.",
  "His slaves **Vífill and Karli** eventually found them in a bay steaming with hot springs, which he named **Reykjavík**, \"Bay of Smokes.\" (The saga's \"three-year search\" wobbles even across the old sources — treat it as story, not stopwatch.)"],
 point:"The modern Ring Road is the last chapter of that story — stitching together the coast Ingólfur started.",
 mic:"The saga begins with a man chasing two pillars. It ends with a whole nation driving the road that traces his coastline.",
 weather:"You can't see far up the road in this weather, which is fitting — Iceland's first settler picked where to live by throwing two carved pillars overboard and following where they washed up, no visibility required.",
 say:[["Leið 1","LAY-th ett","the Ring Road we're on, only completed in 1974"],
      ["Ingólfur Arnarson","EENG-gohl-vur AR-nar-son","the first permanent Norse settler, who followed his high-seat pillars ashore"],
      ["Höfn","HUFN","the south-east port that took hundreds of extra km to reach before this road"]],
 tags:["#migration"]},

{id:"1.31", emoji:"🌋", title:"Hveragerði — Quakes, Cakes and Steam", cue:"Look right at 3 o'clock — Hveragerði.",
 target:{lat:63.9975943, lon:-21.1868303, name:"Hveragerði"},
 hook:"A town of ~**2,660 people** where the ground occasionally rearranges itself — and the locals responded by **building an exhibition around the crack in their floor**.",
 bullets:[
  "Hveragerði sits on a **three-way tectonic junction** on the edge of the **Hengill volcanic system** — so geothermal that fumaroles and mud pots vent **between the houses**. On **29 May 2008** an **Mw 6.3** quake, its rupture only ~2 km away, split buildings and re-plumbed the town's hot springs.",
  "Rather than hide it, locals built the **Skjálftinn 2008** (\"The Quake\") exhibition inside the **Sunnumörk** shopping centre — right over a fissure the quake tore through the building. Stand on the crack, ride the shaking simulator.",
  "Cheap volcanic heat made it a **greenhouse town** from the 1920s (first geothermal greenhouse **1923**): tomatoes, cucumbers, flowers — and, at the horticultural college, **experimental bananas** (about a tonne a year, purely a science project — Iceland is *not* a banana republic)."],
 point:"Pizza baked by a volcano. Beer brewed with geothermal heat. A shopping mall built on an earthquake crack. Yes, all in the same town.",
 mic:"Most towns hide their disasters. Hveragerði put theirs in the lobby and charged admission.",
 weather:"If the town's lost in the murk, look for the steam rising between the houses — Hveragerði sits on a tectonic junction so lively it built a museum around the crack an earthquake tore through the mall.",
 say:[["Hveragerði","KVE-ra-ger-dhi","the greenhouse town on your right, with steam venting between the houses"],
      ["Skjálftinn","SKYALF-tin","The Quake, the exhibition built over the crack the 2008 earthquake tore"],
      ["Sunnumörk","SUN-nu-murk","the shopping centre that fissure runs through"]],
 tags:["#geology"]},

{id:"1.32", emoji:"🏢", title:"Hellisheiðarvirkjun — The Dragon's Breath", cue:"Look right at 2 o'clock — Hellisheiði geothermal plant.",
 target:{lat:64.0365423, lon:-21.3976306, name:"Hellisheiðarvirkjun"},
 hook:"In most countries, a volcano is a disaster plan. In Iceland, it's the **light switch**.",
 bullets:[
  "We're on the **Hengill volcanic system**, a rare **plate-boundary triple junction on dry land**. Water goes down, returns at nearly **300°C**, and spins turbines — the white plumes are **steam**, not smoke. Built up in stages 2006–2011 to **303 MW**, it's **Iceland's largest geothermal power station**.",
  "After the electricity, the leftover hot water pipes off to heat **more than half of the capital region** — nothing wasted.",
  "Via **CarbFix**, CO₂ is dissolved in water and pumped into hot basalt, where **~95% turns to solid rock within about two years** (Matter et al., 2016). Next door, **Climeworks' Mammoth** plant (2024) sucks CO₂ straight from the air — up to **36,000 tonnes a year** — for the same rock treatment."],
 point:"While the world debates carbon capture, Iceland dissolves the problem in water, files it under \"rocks,\" and moves on.",
 mic:"Your shower in Reykjavík tonight was heated by the same volcano that's currently filing CO₂ as gravel under your feet.",
 weather:"If the fog's merged with the steam plumes on your right, you honestly can't tell where the weather ends and the power station begins — and either way, that's what's heating your shower tonight.",
 say:[["Hellisheiðarvirkjun","HEL-li-shay-thar-VIRK-yun","Iceland's largest geothermal power station, the steam plumes on your right"],
      ["Hengill","HEN-gitl","the volcanic system underneath it, a plate-boundary triple junction on dry land"],
      ["Hellisheiði","HEL-lis-HAY-thi","the heath and pass the plant is named after"]],
 tags:["#technology","#geology"]},

{id:"1.33", emoji:"⛰️", title:"Kristnitökuhraun — The Decision Rock", cue:"Look left at 9 o'clock — Kristnitökuhraun, the Christianity Lava.",
 target:{lat:64.0153893, lon:-21.493378, name:"Kristnitökuhraun"},
 hook:"Can a volcano vote? Around **the year 1000**, one sort of did. One chieftain out-thought it with a single question.",
 bullets:[
  "Remember **Þorgeir under his cloak** at Þingvellir this morning? Same assembly, same knife-edge year — two faiths, two law codes, one looming civil war. This lava field is where that story grew teeth.",
  "At peak tension a messenger reported **lava flowing on Hellisheiði**. Pagans cried \"the gods are angry!\"",
  "Chieftain **Snorri Goði** pointed at the ancient lava underfoot: *\"What were the gods angry about when this rock was made?\"* Silence — and Iceland chose Christianity to keep **one law** for the whole island. *(Kristni saga)*",
  "**And here's the thing — look left: the dark field out your window IS that lava.** It's the fresh top of the three-flow **Svínahraun** stack, radiocarbon-dated to around **1000 CE**, so it **inherited its name** from the conversion it coincided with. Fitting footnote: today the **CarbFix** project uses this very basalt to turn CO₂ into stone — the rock that once \"proved\" divine anger now mops up industrial emissions."],
 point:"A whole country's religion settled by a single, calm geology question.",
 mic:"The pagans claimed a volcano was voting. Snorri pointed out the ballot box was older than the religion.",
 weather:"Even hidden in mist, the point of this lava field survives — a thousand years ago one chieftain looked at rock exactly this old and asked which gods were angry when it formed, and that settled a whole nation's religion.",
 say:[["Kristnitökuhraun","KRIST-ni-tuh-ku-HROYN","the Christianity Lava on your left, named for the conversion it coincided with"],
      ["Svínahraun","SVEE-na-hroyn","the three-flow lava stack it sits on top of"],
      ["Snorri Goði","SNOH-ri GO-thi","the chieftain who asked what the gods were angry about when the old rock was made"],
      ["Hellisheiði","HEL-lis-HAY-thi","the heath where the lava was reported flowing"],
      ["Þorgeir Ljósvetningagoði","THOR-gayr LYOH-sveht-ning-a-go-thi","the Lawspeaker whose cloak-nap verdict this lava is named for"]],
 tags:["#geology","#literature","#religion"]},

{id:"1.34", emoji:"⛰️", title:"Rauðhólar — The Mars Impostors", cue:"Look right at 3 o'clock — Rauðhólar.",
 target:{lat:64.0942147, lon:-21.7552248, name:"Rauðhólar"},
 hook:"A line of perfect little volcanoes — and **not one of them is real**. NASA can't get enough.",
 bullets:[
  "These are **pseudocraters** (Icelandic *gervigígar*) — properly, **rootless cones**: no magma pipe, no roots. Fake volcanoes.",
  "**~5,000 years ago** lava from the **Leiti** shield volcano rolled over the **Heiðmörk** wetland; trapped water flashed to steam and, in a **phreatomagmatic** blast, **punched back out** through the molten lava — frozen mid-explosion in red scoria (iron oxide — rust).",
  "Originally ~**80 cones**. Because a rootless cone only forms where lava met water, geologists read Iceland's as a template for **Mars** — the rootless cones of **Athabasca Valles** are cited as evidence of buried water on the Red Planet.",
  "Then, practically, the British army mined the field for gravel to build **Reykjavík airport** in WWII; digging continued for years. Protected in **1974**.",
  "One full-circle glance before the city: behind the cones lies **Elliðavatn** — and on a low spit in it, **Þingnes**, the **second home of the Kjalarnesþing**, the regional assembly you met this morning. It kept meeting there into the **1200s** — so you're leaving the Golden Circle past the country's original parliament grounds.",
  "And the electricity story closes here too: the **Elliðaár** valley below held **Reykjavík's first power station (1921)** — seventeen years after **Reykdal's carpentry-shop plant** lit the nation's first bulbs in Hafnarfjörður. From a workshop stream to a volcano filing CO₂ as gravel: one century of Icelandic power, and you've just driven the whole arc."],
 point:"Two armies and one city carved up Iceland's Mars lab and paved it into a runway.",
 mic:"Eighty cones. One Mars classroom. Half of it now under your runway.",
 weather:"If you can't see the little red hills on your right, don't feel cheated — they're fake volcanoes with no roots, so convincing that NASA studies them to understand Mars, all wasted on today's fog.",
 say:[["Rauðhólar","ROY-thoh-lar","the little red cones on your right; fake volcanoes with no roots"],
      ["Leitahraun","LAY-ta-HROYN","the lava from the Leiti shield volcano that rolled over the wetland"],
      ["Heiðmörk","HAY-thmurk","the wetland it rolled over, whose trapped water blew the cones out"],
      ["Elliðavatn","ET-li-tha-vatn","the lake behind the cones, holding the old assembly ground"],
      ["Þingnes","THING-ness","the low spit where the Kjalarnesþing kept meeting into the 1200s"],
      ["Kjalarnesþing","KYAL-ar-ness-thing","the regional assembly from this morning, in its second home"],
      ["Elliðaár","ET-li-thow-ar","the river valley holding Reykjavík's first power station"],
      ["Reykdal","RAYK-dal","the Hafnarfjörður carpenter whose 1904 plant lit the nation's first bulbs"]],
 tags:["#geology"]}
]}
]};

: "1.28", "sec": "S6", "cue": "Look right at 1–2 o'clock — Ölfusá.", "target": {"lat": 63.938467, "lon": -21.006635, "name": "Ölfusá"}, "pin": {"lat": 63.93878, "lon": -21.00478}, "clock": 8, "dist_m": 97, "progress": 77.1}, {"id": "1.29", "sec": "S6", "cue": "Look right at 3 o'clock — Ölfusárbrú.", "target": {"lat": 63.9387838, "lon": -21.0047735, "name": "Ölfusárbrú"}, "pin": {"lat": 63.93878, "lon": -21.00478}, "clock": 1, "dist_m": 1, "progress": 77.1}, {"id": "1.30", "sec": "S6", "cue": "Look ahead at 12 o'clock — the Ring Road (Leið 1).", "target": null, "pin": null}, {"id": "1.31", "sec": "S6", "cue": "Look right at 3 o'clock — Hveragerði.", "target": {"lat": 63.9975943, "lon": -21.1868303, "name": "Hveragerði"}, "pin": {"lat": 63.99766, "lon": -21.1874}, "clock": 3, "dist_m": 29, "progress": 82.1}, {"id": "1.32", "sec": "S6", "cue": "Look right at 2 o'clock — Hellisheiði geothermal plant.", "target": {"lat": 64.0365423, "lon": -21.3976306, "name": "Hellisheiðarvirkjun"}, "pin": {"lat": 64.02841, "lon": -21.42184}, "clock": 3, "dist_m": 1486, "progress": 88.0}, {"id": "1.33", "sec": "S6", "cue": "Look left at 9 o'clock — Kristnitökuhraun, the Christianity Lava.", "target": {"lat": 64.0153893, "lon": -21.493378, "name": "Kristnitökuhraun"}, "pin": {"lat": 64.03554, "lon": -21.44901}, "clock": 9, "dist_m": 3113, "progress": 88.7}, {"id": "1.34", "sec": "S6", "cue": "Look right at 3 o'clock — Rauðhólar.", "target": {"lat": 64.0942147, "lon": -21.7552248, "name": "Rauðhólar"}, "pin": {"lat": 64.09877, "lon": -21.74735}, "clock": 9, "dist_m": 635, "progress": 95.2}];

<script>
const R = window.__ROUTE__, S = window.__SCRIPT__, CUES = window.__CUES__;
const CUE = {}; CUES.forEach(c => CUE[c.id] = c);
const COL = {drive:"#5ec8f2", stop:"#c8a2f2"};

// fadeAnimation:false is not cosmetic. With a service worker in front of the tile requests,
// Leaflet's fade never flips tiles from opacity 0 to 1 — every tile downloads correctly
// (naturalWidth 256) and then paints invisibly, so you get a blank map and no error anywhere.
// Turning the fade off makes tiles opaque the moment they arrive.
const map = L.map("map",{fadeAnimation:false}).setView([64.15,-20.9],8);

const SAT = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:19, maxNativeZoom:17, attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'});
const TERRAIN = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {maxZoom:19, maxNativeZoom:15, attribution:'&copy; OpenTopoMap, &copy; OpenStreetMap contributors'});
const DARK = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'});
// Road casings and place names printed over the imagery — satellite alone is pretty and useless.
const SATLBL = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:19, maxNativeZoom:16, attribution:''});

// Sentinel-2 cloudless (EOX, CC-BY) as a second imagery source. Esri is better where it
// has coverage, but if anything blocks it — a preview pane, an ad blocker, a corporate
// network — a grey rectangle is useless on a coach. Fall through instead of failing.
const SAT2 = L.tileLayer("https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg",
  {maxZoom:19, maxNativeZoom:14, attribution:'Sentinel-2 cloudless &copy; EOX IT Services (CC BY-NC-SA 4.0)'});

SAT.addTo(map); SATLBL.addTo(map);
const layerCtl = L.control.layers({"Satellite (Esri)":SAT,"Satellite (Sentinel-2)":SAT2,"Terrain":TERRAIN,"Dark map":DARK},
                 {"Names on satellite":SATLBL},{position:"topright"}).addTo(map);

// ---- imagery watchdog -------------------------------------------------------
// Leaflet fires tileerror per failed tile. A handful is normal at the edges of coverage;
// a wall of them means the source is blocked. Switch once, say so, and move on.
let satErr = 0, satOK = 0, switched = false;
SAT.on("tileload", ()=>{ satOK++; });
SAT.on("tileerror", ()=>{
  satErr++;
  if(switched || satOK > 0 || satErr < 6) return;
  switched = true;
  map.removeLayer(SAT); SAT2.addTo(map);
  banner("Esri imagery is blocked here — switched to Sentinel-2. Layers control, top right, to change it.");
});
SAT2.on("tileerror", ()=>{
  if(!switched) return;
  banner("Both satellite sources are blocked. You are almost certainly viewing this in a preview pane — open the file in a browser.");
});
function banner(msg){
  let el = document.getElementById("tilewarn");
  if(!el){
    el = document.createElement("div"); el.id = "tilewarn";
    el.style.cssText = "position:absolute;z-index:600;top:10px;left:10px;max-width:340px;background:#3a1a1a;"
      + "border:1px solid #6b2b2b;color:#ffb3b3;border-radius:7px;padding:8px 11px;font:11.5px/1.5 -apple-system,sans-serif";
    document.getElementById("map").appendChild(el);
  }
  el.textContent = msg;
}

const routeLine = L.polyline(R.geometry,{color:"#5ec8f2",weight:4,opacity:.85}).addTo(map);

function esc(s){ return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function md(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>"); }

// Markers built once and never rebuilt — a rebuild-on-zoom is what raced the old map's popups.
const CUEM={}, TGTM={}, LINK={};
CUES.forEach(c=>{
  if(!c.pin) return;
  const stop = c.sec==="S2"||c.sec==="S4"||c.sec==="S5";
  const col = stop ? COL.stop : COL.drive;
  CUEM[c.id]=L.marker([c.pin.lat,c.pin.lon],{icon:L.divIcon({className:"",iconSize:[38,22],iconAnchor:[19,11],
    html:`<div class="mpill" style="background:${col}">${c.id}</div>`})})
    .bindPopup(`<b>${c.id}</b><br><span style="color:#556">${c.cue?esc(c.cue):"story block"}</span>`);
  if(c.target){
    TGTM[c.id]=L.marker([c.target.lat,c.target.lon],{icon:L.divIcon({className:"",iconSize:[11,11],iconAnchor:[5,5],html:'<div class="mtgt"></div>'})})
      .bindPopup(`<b>${esc(c.target.name)}</b><br>${c.dist_m>=1000?(c.dist_m/1000).toFixed(1)+" km":c.dist_m+" m"} away · reads ${c.clock} o'clock`);
    LINK[c.id]=L.polyline([[c.pin.lat,c.pin.lon],[c.target.lat,c.target.lon]],{color:"#fff",weight:1.5,opacity:.8,dashArray:"4,6"});
  }
});
let SHOWN=null;
function focusBlock(id){
  if(SHOWN && SHOWN!==id) [CUEM,TGTM,LINK].forEach(g=>{ if(g[SHOWN]&&map.hasLayer(g[SHOWN])) map.removeLayer(g[SHOWN]); });
  SHOWN=id; const c=CUE[id]; if(!c||!c.pin) return;
  CUEM[id].addTo(map); if(TGTM[id]) TGTM[id].addTo(map); if(LINK[id]) LINK[id].addTo(map);
  const pts=[[c.pin.lat,c.pin.lon]]; if(c.target) pts.push([c.target.lat,c.target.lon]);
  if(pts.length>1) map.fitBounds(L.latLngBounds(pts).pad(.45),{maxZoom:13}); else map.flyTo(pts[0],13,{duration:.5});
  CUEM[id].openPopup();
}

const list=document.getElementById("days");
function blockRow(b, kind){
  const c=CUE[b.id]||{};
  const col = kind==="stop" ? COL.stop : COL.drive;
  const say=(b.say||[]).map(s=>`<div><b>${esc(s[0])}</b> <i>[${esc(s[1])}]</i> — ${esc(s[2])}</div>`).join("");
  const heads=(b.heads||[]).map(h=>`<div class="sublab">${esc(h[0])}</div><ul>${h[1].map(x=>`<li>${md(x)}</li>`).join("")}</ul>`).join("");
  const pre=(b.pre||[]).map(p=>`<div class="sublab">${esc(p[0])}</div><div class="pre">${esc(p[1])}</div>`).join("");
  const S2=[];
  if(b.cue) S2.push(`<span class="lb">CUE</span><span class="v">${esc(b.cue)}</span>`);
  if(c.target) S2.push(`<span class="dr">◇ ${esc(c.target.name)} · ${c.dist_m>=1000?(c.dist_m/1000).toFixed(1)+" km":c.dist_m+" m"} · ${c.clock} o'clock</span>`);
  return `<div class="stop" data-key="${b.id}"><div class="num${c.target?"":" noview"}" style="${c.target?`background:${col}`:""}">${b.id}</div>
      <div class="sc"><div class="sn">${b.emoji?b.emoji+" ":""}${esc(b.title)}</div>
      ${!c.target?`<div class="legln">no view — tell it anywhere on this stretch</div>`:""}
      ${S2.length?`<div class="tstrip">${S2.join('<span class="sep">·</span>')}</div>`:""}</div></div>
    <div class="blkbody">
      ${b.hook?`<div class="hook">🎣 ${md(b.hook)}</div>`:""}
      ${heads}${pre}
      ${(b.bullets&&b.bullets.length)?`<ul>${b.bullets.map(x=>`<li>${md(x)}</li>`).join("")}</ul>`:""}
      ${b.point?`<div class="pt">🎯 ${md(b.point)}</div>`:""}
      ${b.mic?`<div class="mc">🎤 ${md(b.mic)}</div>`:""}
      ${b.weather?`<div class="wx">🌫️ ${md(b.weather)}</div>`:""}
      ${b.flag?`<div class="flag"><b>Check this:</b> ${esc(b.flag)}</div>`:""}
      ${say?`<div class="say"><div class="sublab">🗣️ How to say it</div>${say}</div>`:""}
      ${(b.tags||[]).length?`<div class="tags">${b.tags.join(" ")}</div>`:""}
    </div>`;
}
function render(filter){
  const f=(filter||"").trim().toLowerCase();
  list.innerHTML="";
  S.sections.forEach((sec,si)=>{
    const blocks=sec.blocks.filter(b=>!f || JSON.stringify(b).toLowerCase().includes(f));
    if(!blocks.length) return;
    const col=COL[sec.kind];
    const el=document.createElement("div"); el.className="day"; el.dataset.i=si;
    el.innerHTML=`<div class="dayhead"><span class="dot" style="background:${col}"></span>
        <span class="t">${sec.kind==="stop"?"📍":"🚌"} ${esc(sec.title)}</span>
        <span class="m">${blocks.length} block${blocks.length>1?"s":""}</span></div>
      <div class="body">${blocks.map(b=>blockRow(b,sec.kind)).join("")}</div>`;
    el.querySelector(".dayhead").onclick=()=>{
      const open=el.classList.toggle("open"); el.classList.toggle("shown",open);
    };
    el.querySelectorAll(".stop[data-key]").forEach(row=>{
      row.addEventListener("click",ev=>{
        if(ev.target.closest("a")) return;
        row.classList.toggle("open");
        focusBlock(row.dataset.key);
      });
    });
    list.appendChild(el);
    if(f){ el.classList.add("open"); el.querySelectorAll(".stop").forEach(r=>r.classList.add("open")); }
  });
}
document.getElementById("all").onclick=()=>document.querySelectorAll(".day").forEach(e=>{e.classList.add("open");e.classList.add("shown");});
document.getElementById("none").onclick=()=>document.querySelectorAll(".day").forEach(e=>{e.classList.remove("open");e.classList.remove("shown");});
document.getElementById("fit").onclick=()=>{
  if(SHOWN){[CUEM,TGTM,LINK].forEach(g=>{if(g[SHOWN]&&map.hasLayer(g[SHOWN]))map.removeLayer(g[SHOWN]);});SHOWN=null;}
  map.fitBounds(routeLine.getBounds().pad(.06));
};
document.getElementById("find").addEventListener("input",e=>render(e.target.value));
map.on("zoomend",()=>{document.getElementById("zhint").style.display=map.getZoom()>=11?"none":"block";});

const nB=S.sections.reduce((a,s)=>a+s.blocks.length,0), nT=CUES.filter(c=>c.target).length;
document.getElementById("foot").innerHTML=
  `${nB} script blocks · ${nT} pinned to something you can point at · ${nB-nT} story blocks with no view. `+
  `Route ${R.km} km, coach-legal roads only. Coordinates verified against OpenStreetMap, 8 Aug 2026.<br>`+
  `Basemap © Esri / OpenStreetMap / CARTO. <span id="sw"></span>`;

if("serviceWorker" in navigator) window.addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js").then(()=>{const el=document.getElementById("sw");if(el){el.textContent="· Offline ready";el.style.color="#9fdcae";}}).catch(()=>{});
});

render("");
map.fitBounds(routeLine.getBounds().pad(.06));
</script>

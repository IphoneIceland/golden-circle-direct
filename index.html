<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Circle Direct</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root{--bg:#0e1114;--panel:#161b21;--panel2:#1d242c;--line:#2b333d;--ink:#e8edf2;--mute:#93a1b0;--accent:#5ec8f2;--fs:16px;--lh:1.8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #wrap{display:flex;flex-direction:column;height:100%;height:100dvh;overflow:hidden}
  #map{flex:none;height:34%;min-height:160px;position:relative}
  #secbar,#blkbar{flex:0 0 auto;display:flex;align-items:stretch;gap:8px;padding:7px 10px;border-top:1px solid var(--line);background:var(--panel2)}
  #blkbar{background:var(--panel)}
  #secbar button,#blkbar button{flex:none;width:54px;font-size:22px;line-height:1;padding:0;border-radius:9px}
  #secbar button:disabled,#blkbar button:disabled{opacity:.25;cursor:default;color:var(--mute);border-color:var(--line)}
  .mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
  #stitle,#btitle{font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  #stitle{color:#9fe0ff}
  #scount,#bcount{font-size:11px;color:var(--mute)}
  #days{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
        padding:14px 14px calc(48px + env(safe-area-inset-bottom));font-size:var(--fs);line-height:var(--lh);border-top:1px solid var(--line)}
  .blkbody{max-width:66ch}
  .day{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel2);overflow:hidden}
  .dayhead{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;user-select:none}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .dayhead .t{font-size:1.02em;font-weight:600;flex:1;line-height:1.45}
  .day.shown{border-color:#5ec8f2}
  .dayhead .m{font-size:.82em;color:var(--mute);white-space:nowrap;text-align:right;line-height:1.5}
  .body{display:none;padding:2px 13px 13px}
  .day.open .body{display:block}
  .stop{display:flex;gap:11px;padding:13px 0;border-top:1px solid #262e37}
  .stop[data-key]{cursor:pointer;border-radius:6px;margin:0 -6px;padding-left:6px;padding-right:6px;transition:background .12s}
  .stop[data-key]:hover{background:#232c35}
  .stop[data-key]:hover .sn{color:var(--accent)}
  .stop[data-key]:active{background:#2a343f}
  .num{flex:none;min-width:26px;height:26px;padding:0 6px;border-radius:13px;display:flex;align-items:center;justify-content:center;font:700 .78em/1 ui-monospace,Menlo,monospace;color:#0e1114}
  .num.noview{background:transparent;border:1.5px dashed #93a1b0;color:#93a1b0}
  .sc{flex:1;min-width:0}
  .sn{font-size:1.08em;font-weight:600;line-height:1.45;letter-spacing:.005em}
  .sub{font-size:.97em;line-height:1.55;color:#9ec8dd;margin-top:4px}
  .thr{font-size:.82em;font-weight:600;color:#7d8fa0;margin-top:7px;line-height:1.5}
  .storylab{font-size:.85em;font-weight:700;color:#8fa3b4;margin-top:16px;margin-bottom:2px}
  .sd{font-size:11.5px;color:var(--mute);line-height:1.5;margin-top:1px}
  .tstrip{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-top:10px}
  .tstrip .lb{font-size:.76em;font-weight:700;color:#8fa3b4;margin-right:3px}
  .tstrip .v{font-size:.98em;font-weight:700;color:#e8edf2;line-height:1.5}
  .tstrip .v.dep{color:#9fe0ff}
  .tstrip .dr{font-size:.88em;font-weight:600;color:#8fb6cc;white-space:nowrap;line-height:1.5}
  .tstrip .sep{color:#39434e}
  .blkbody{display:none;padding:2px 0 6px}
  .stop.open + .blkbody{display:block}
  .hook{margin-top:14px;padding:13px 14px;border-radius:9px;background:#0f2530;border:1px solid #1d4b5e;color:#cdeaf7;font-size:1em;line-height:var(--lh)}
  .blkbody ul{margin:8px 0 0;padding-left:20px}
  .blkbody li{font-size:1em;line-height:var(--lh);color:#d3dde6;margin-bottom:14px;padding-left:2px}
  .pt{margin-top:14px;padding:13px 14px;border-radius:9px;background:#12251a;border:1px solid #2c4a34;color:#cfeeda;font-size:1em;line-height:var(--lh)}
  .mc{margin-top:12px;padding:13px 14px;border-radius:9px;background:#2a1e0d;border:1px solid #5c3f14;color:#f6dfab;font-size:1em;line-height:var(--lh);font-weight:500}
  .wx{margin-top:12px;padding:12px 14px;border-radius:9px;background:#1a2027;border:1px solid #2b3641;color:#adc0ce;font-size:.95em;line-height:var(--lh)}
  .flag{margin-top:12px;padding:13px 14px;border-radius:9px;background:#33191a;border:1px solid #6b2b2b;color:#ffc4c4;font-size:1em;line-height:var(--lh)}
  .pre{margin-top:9px;padding:9px 10px;border-radius:7px;background:#11161b;border:1px solid #232c35;color:#9fb3c2;font:10.5px/1.55 ui-monospace,Menlo,monospace;overflow-x:auto;white-space:pre}
  .sublab{font-size:.85em;font-weight:700;color:#8fa3b4;margin-top:14px}
  .say{margin-top:10px;border-top:1px solid #262e37;padding-top:8px}
  .say>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;user-select:none;padding:2px 0}
  .say>summary::-webkit-details-marker{display:none}
  .say>summary .sublab{margin-top:0}
  .say>summary .chev{color:#8fa3b4;font-size:.72em;line-height:1;transition:transform .15s ease;display:inline-block}
  .say[open]>summary .chev{transform:rotate(90deg)}
  .say>summary .cnt{font-size:.8em;font-weight:700;color:#8fa3b4}
  .say>summary:hover .sublab,.say>summary:hover .cnt,.say>summary:hover .chev{color:var(--accent)}
  .say>div:first-of-type{margin-top:7px}
  .say div{font-size:.95em;line-height:1.85;color:#b6c3ce;margin-bottom:7px}
  .say b{color:#e8edf2;font-weight:600}
  .blkbody li b,.hook b,.pt b,.flag b,.mc b{font-weight:600;color:#ffffff}
  .say .gloss{color:#7f8f9d}
  .say i{color:#f4d5a0;font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:.9em}
  .legln{font-size:.9em;color:#8496a5;margin-top:5px;line-height:1.55}
  .tags{font-size:10px;color:#5b6b7a;margin-top:8px}
  #map{flex:1;position:relative}
  #zhint{position:absolute;z-index:500;bottom:14px;left:14px;background:rgba(22,27,33,.92);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--mute)}
  #foot{padding:11px 20px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mute);line-height:1.6}
  #foot a{color:var(--accent)}
  @media (max-width:860px){#wrap{flex-direction:column}#map{order:-1;height:38%;min-height:220px;border-bottom:1px solid var(--line)}#side{width:100%;min-width:0;height:62%;border-right:none;border-bottom:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="map"><div id="zhint">Zoom in further to show place names</div></div>
  <div id="secbar">
    <button id="sprev" aria-label="Previous drive section">‹</button>
    <div class="mid"><div id="stitle"></div><div id="scount"></div></div>
    <button id="snext" aria-label="Next drive section">›</button>
  </div>
  <div id="blkbar">
    <button id="bprev" aria-label="Previous block">‹</button>
    <div class="mid"><div id="btitle"></div><div id="bcount"></div></div>
    <button id="bnext" aria-label="Next block">›</button>
  </div>
  <div id="days"></div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="route-1.0.js"></script>
<script src="script-1.0.js"></script>
<script src="cues-1.0.js"></script>
<script>
const R = window.__ROUTE__, S = window.__SCRIPT__, CUES = window.__CUES__;
const CUE = {}; CUES.forEach(c => CUE[c.id] = c);
const COL = {drive:"#5ec8f2", stop:"#c8a2f2"};

// fadeAnimation:false is not cosmetic. With a service worker in front of the tile requests,
// Leaflet's fade never flips tiles from opacity 0 to 1 — every tile downloads correctly
// (naturalWidth 256) and then paints invisibly, so you get a blank map and no error anywhere.
// Turning the fade off makes tiles opaque the moment they arrive.
const map = L.map("map",{fadeAnimation:false}).setView([64.15,-20.9],8);

const SAT = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:19, maxNativeZoom:17, attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'});
const TERRAIN = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {maxZoom:19, maxNativeZoom:15, attribution:'&copy; OpenTopoMap, &copy; OpenStreetMap contributors'});
const DARK = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'});
// Road casings and place names printed over the imagery — satellite alone is pretty and useless.
const SATLBL = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:19, maxNativeZoom:16, attribution:''});

// Sentinel-2 cloudless (EOX, CC-BY) as a second imagery source. Esri is better where it
// has coverage, but if anything blocks it — a preview pane, an ad blocker, a corporate
// network — a grey rectangle is useless on a coach. Fall through instead of failing.
const SAT2 = L.tileLayer("https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg",
  {maxZoom:19, maxNativeZoom:14, attribution:'Sentinel-2 cloudless &copy; EOX IT Services (CC BY-NC-SA 4.0)'});

SAT.addTo(map); SATLBL.addTo(map);
const layerCtl = L.control.layers({"Satellite (Esri)":SAT,"Satellite (Sentinel-2)":SAT2,"Terrain":TERRAIN,"Dark map":DARK},
                 {"Names on satellite":SATLBL},{position:"topright"}).addTo(map);

// ---- imagery watchdog -------------------------------------------------------
// Leaflet fires tileerror per failed tile. A handful is normal at the edges of coverage;
// a wall of them means the source is blocked. Switch once, say so, and move on.
let satErr = 0, satOK = 0, switched = false;
SAT.on("tileload", ()=>{ satOK++; });
SAT.on("tileerror", ()=>{
  satErr++;
  if(switched || satOK > 0 || satErr < 6) return;
  switched = true;
  map.removeLayer(SAT); SAT2.addTo(map);
  banner("Esri imagery is blocked here — switched to Sentinel-2. Layers control, top right, to change it.");
});
SAT2.on("tileerror", ()=>{
  if(!switched) return;
  banner("Both satellite sources are blocked. You are almost certainly viewing this in a preview pane — open the file in a browser.");
});
function banner(msg){
  let el = document.getElementById("tilewarn");
  if(!el){
    el = document.createElement("div"); el.id = "tilewarn";
    el.style.cssText = "position:absolute;z-index:600;top:10px;left:10px;max-width:340px;background:#3a1a1a;"
      + "border:1px solid #6b2b2b;color:#ffb3b3;border-radius:7px;padding:8px 11px;font:11.5px/1.5 -apple-system,sans-serif";
    document.getElementById("map").appendChild(el);
  }
  el.textContent = msg;
}

// The road you have actually travelled. It grows as the tour does — nothing
// ahead of you is drawn, because you haven't been there yet.
const GEO = R.geometry;
const CUM = (()=>{
  const out=[0];
  for(let i=1;i<GEO.length;i++){
    const [a,b]=GEO[i-1], [c,d]=GEO[i];
    const dy=(c-a)*111.32, dx=(d-b)*111.32*Math.cos((a+c)/2*Math.PI/180);
    out.push(out[i-1]+Math.sqrt(dx*dx+dy*dy));
  }
  return out;
})();
const TOTAL = CUM[CUM.length-1];
function travelled(pct){
  if(pct==null) return [GEO[0]];
  const want = TOTAL*Math.max(0,Math.min(100,pct))/100;
  const out=[];
  for(let i=0;i<GEO.length;i++){
    out.push(GEO[i]);
    if(CUM[i]>=want) break;
  }
  return out.length>1?out:[GEO[0],GEO[0]];
}
const routeLine = L.polyline(travelled(0),{color:"#5ec8f2",weight:4,opacity:.9}).addTo(map);
// how far along we are at a given block: its own progress, or the last one behind it
const PROG = (()=>{
  const m={}; let last=0;
  S.sections.forEach(sec=>sec.blocks.forEach(b=>{
    const c=CUE[b.id];
    if(c && typeof c.progress==="number") last=c.progress;
    m[b.id]=last;
  }));
  return m;
})();

function esc(s){ return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function md(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>"); }

// Markers built once and never rebuilt — a rebuild-on-zoom is what raced the old map's popups.
const HERE = L.circleMarker([0,0],{radius:8,color:"#fff",weight:3,fillColor:"#5ec8f2",fillOpacity:1,
  pane:"markerPane"});
  }
});
function focusBlock(id){
  const c=CUE[id];
  if(!c||!c.pin){ return; }              // story block — leave the map where it is
  HERE.setLatLng([c.pin.lat,c.pin.lon]).addTo(map);
  map.panTo([c.pin.lat,c.pin.lon],{animate:true,duration:.4});
}

const list=document.getElementById("days");
function blockRow(b, kind){
  const c=CUE[b.id]||{};
  const col = kind==="stop" ? COL.stop : COL.drive;
  const say=(b.say||[]).map(s=>`<div><i>[${esc(s[1])}]</i> — <b>${esc(s[0])}</b>${s[2]?` <span class="gloss">(${esc(s[2])})</span>`:""}</div>`).join("");
  const heads=(b.heads||[]).map(h=>`<div class="sublab">${esc(h[0])}</div><ul>${h[1].map(x=>`<li>${md(x)}</li>`).join("")}</ul>`).join("");
  const pre=(b.pre||[]).map(p=>`<div class="sublab">${esc(p[0])}</div><div class="pre">${esc(p[1])}</div>`).join("");
  const S2=[];
  if(b.cue) S2.push(`<span class="lb">CUE</span><span class="v">${esc(b.cue)}</span>`);

  return `<div class="stop" data-key="${b.id}"><div class="num${c.target?"":" noview"}" style="${c.target?`background:${col}`:""}">${b.id}</div>
      <div class="sc"><div class="sn">${b.emoji?b.emoji+" ":""}${esc(b.title)}</div>
      ${b.sub?`<div class="sub">${esc(b.sub)}</div>`:""}
      ${(b.tags||[]).length?`<div class="thr">🧵 ${b.tags.join(" ")}</div>`:""}
      ${S2.length?`<div class="tstrip">${S2.join('<span class="sep">·</span>')}</div>`:""}</div></div>
    <div class="blkbody">
      ${b.hook?`<div class="hook">🎣 ${md(b.hook)}</div>`:""}
      ${heads}${pre}
      ${(b.bullets&&b.bullets.length)?`<div class="storylab">📖 The story</div><ul>${b.bullets.map(x=>`<li>${md(x)}</li>`).join("")}</ul>`:""}
      ${b.point?`<div class="pt">🎯 ${md(b.point)}</div>`:""}
      ${b.mic?`<div class="mc">🎤 ${md(b.mic)}</div>`:""}
      ${b.weather?`<div class="wx">🌫️ ${md(b.weather)}</div>`:""}
      ${say?`<details class="say"><summary><span class="chev">▶</span><span class="sublab">🗣️ How to say it</span><span class="cnt">${(b.say||[]).length}</span></summary>${say}</details>`:""}
    </div>`;
}
let SI=0, BI=0;
const flat=()=>{const o=[];S.sections.forEach((sec,si)=>sec.blocks.forEach((b,bi)=>o.push({si,bi})));return o;};
const $=id=>document.getElementById(id);

function render(){
  const sec=S.sections[SI], b=sec.blocks[BI];
  list.innerHTML=blockRow(b,sec.kind);   // no .body wrapper — that rule is display:none outside an open .day
  list.querySelectorAll(".stop[data-key]").forEach(r=>r.classList.add("open"));
  list.scrollTop=0;

  $("stitle").textContent=(sec.kind==="stop"?"📍 ":"🚌 ")+sec.title;
  $("scount").textContent=(SI+1)+" of "+S.sections.length;
  $("btitle").textContent=(b.emoji?b.emoji+" ":"")+b.title;
  $("bcount").textContent=(BI+1)+" of "+sec.blocks.length;

  $("sprev").disabled = SI===0;
  $("snext").disabled = SI===S.sections.length-1;
  const f=flat(), pos=f.findIndex(x=>x.si===SI&&x.bi===BI);
  $("bprev").disabled = pos<=0;
  $("bnext").disabled = pos>=f.length-1;

  routeLine.setLatLngs(travelled(PROG[b.id]));
  focusBlock(b.id);
}
function goSection(d){
  const n=SI+d;
  if(n<0||n>=S.sections.length) return;
  SI=n; BI=0; render();
}
function goBlock(d){
  const f=flat(), pos=f.findIndex(x=>x.si===SI&&x.bi===BI)+d;
  if(pos<0||pos>=f.length) return;
  SI=f[pos].si; BI=f[pos].bi; render();
}
$("sprev").onclick=()=>goSection(-1);
$("snext").onclick=()=>goSection(1);
$("bprev").onclick=()=>goBlock(-1);
$("bnext").onclick=()=>goBlock(1);
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){e.preventDefault();goBlock(-1);}
  if(e.key==="ArrowRight"){e.preventDefault();goBlock(1);}
  if(e.key==="ArrowUp"){e.preventDefault();goSection(-1);}
  if(e.key==="ArrowDown"){e.preventDefault();goSection(1);}
});
map.on("zoomend",()=>{document.getElementById("zhint").style.display=map.getZoom()>=11?"none":"block";});


if("serviceWorker" in navigator) window.addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js").then(()=>{const el=document.getElementById("sw");if(el){el.textContent="· Offline ready";el.style.color="#9fdcae";}}).catch(()=>{});
});

render();
{ const c=CUE[S.sections[0].blocks[0].id];
  const p=(c&&c.pin)?[c.pin.lat,c.pin.lon]:GEO[0];
  map.setView(p,13); }
</script>
</body>
</html>
